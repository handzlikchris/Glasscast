<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, initial-scale=1">
  <title>WebRTC spike</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      background: #000;
      color: #e8eef4;
      font: 15px/1.35 system-ui, "Segoe UI", sans-serif;
      /* Required on Meta Display for continuous pinch-drag; harmless elsewhere. */
      touch-action: none;
    }
    #stage {
      position: relative;
      width: 600px;
      height: 600px;
      overflow: hidden;
    }
    video {
      width: 600px;
      height: 600px;
      object-fit: contain;
      background: #0a0d12;
      display: block;
    }
    #hud {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 12px;
      font-variant-numeric: tabular-nums;
    }
    #hud .k { color: #8fa3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    #hud .v { font-size: 17px; font-weight: 600; }
    #verdict {
      grid-column: 1 / -1;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
    }
    #verdict.pass { background: #1e5a32; }
    #verdict.wait { background: #3a3f47; }
    #verdict.fail { background: #6b4a12; }
    #status {
      position: absolute;
      top: 32px;
      right: 8px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      position: absolute;
      top: 32px;
      left: 8px;
      font: inherit;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #5c7080;
      background: #1b2530;
      color: inherit;
    }
    button:focus-visible { outline: 3px solid #ffd166; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <button id="reconnect" type="button">Reconnect</button>
    <div id="status">connecting…</div>
    <div id="hud">
      <div><div class="k">Latency</div><div class="v" id="latency">–</div></div>
      <div><div class="k">FPS</div><div class="v" id="fps">–</div></div>
      <div><div class="k">Decode</div><div class="v" id="decode">–</div></div>
      <div><div class="k">Codec</div><div class="v" id="codec">–</div></div>
      <div><div class="k">RTT</div><div class="v" id="rtt">–</div></div>
      <div><div class="k">Server</div><div class="v" id="server">–</div></div>
      <div style="grid-column: 1 / -1"><div class="k">Path</div><div class="v" id="path" style="font-size:14px">–</div></div>
      <div id="verdict" class="wait">measuring…</div>
    </div>
  </div>
  <canvas id="probe" width="600" height="24" hidden></canvas>
  <script src="spike.js"></script>
</body>
</html>
