<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Meta Ray-Ban Display renders web apps in a fixed 600×600 viewport. -->
    <meta name="viewport" content="width=600, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- PNG only: Meta's app manager picks the web app's icon from the site, and its troubleshooting
         page says SVG favicons aren't supported (PNG larger than 52x52). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Glasscast" />
    <meta name="theme-color" content="#14C8B8" />
    <title>Glasscast</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
